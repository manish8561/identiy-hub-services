openapi: "3.1.0"
info:
    title: Backend With Cursor API Gateway
    description: |
        API Gateway for microservices-based backend with authentication, user management, and notifications.

        ## Authentication

        Sessions use an HttpOnly cookie named `access_token` containing a JWT. Login and register
        responses set this cookie via `Set-Cookie`. Protected endpoints accept the cookie automatically
        in browsers; API clients may also use `Authorization: Bearer <token>` as a fallback.

        In Swagger UI, use the **cookieAuth** security scheme after logging in (browser sends cookie
        automatically when testing from the same origin).
    version: 0.0.1
    contact:
        name: Backend Team
        email: backend@example.com
servers:
    - url: http://localhost:8080
      description: Development server
    - url: https://api.example.com
      description: Production server
paths:
    /api/auth/health:
        get:
            tags:
                - Health
            summary: Health check for Auth service
            description: Returns the health status of the Auth service via API Gateway.
            operationId: AuthService_Health
            responses:
                "200":
                    description: Auth service is healthy
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HealthStatus'
                "502":
                    description: Auth service is unavailable
    /api/users/health:
        get:
            tags:
                - Health
            summary: Health check for User service
            description: Returns the health status of the User service via API Gateway.
            operationId: UserService_Health
            responses:
                "200":
                    description: User service is healthy
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HealthStatus'
                "502":
                    description: User service is unavailable

    /api/notifications/health:
        get:
            tags:
                - Health
            summary: Health check for Notification service
            description: Returns the health status of the Notification service via API Gateway.
            operationId: NotificationService_Health
            responses:
                "200":
                    description: Notification service is healthy
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HealthStatus'
                "502":
                    description: Notification service is unavailable

    /api/notifications/preferences:
        get:
            tags:
                - Notifications
            summary: Get the current user's email preference
            security:
                - cookieAuth: []
            responses:
                "200":
                    description: Current user's email preference
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    userId: { type: string }
                                    emailEnabled: { type: boolean }
                                    updatedAt: { type: string, format: date-time }
                "401":
                    description: Authentication required
        put:
            tags:
                - Notifications
            summary: Update the current user's email preference
            security:
                - cookieAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [emailEnabled]
                            properties:
                                emailEnabled: { type: boolean }
            responses:
                "200":
                    description: Updated email preference
                "400":
                    description: Missing or invalid emailEnabled value
                "401":
                    description: Authentication required

    /api/notifications/history:
        get:
            tags:
                - Notifications
            summary: List the current user's notification delivery history
            security:
                - cookieAuth: []
            parameters:
                - name: page
                  in: query
                  schema: { type: integer, minimum: 1, default: 1 }
                - name: size
                  in: query
                  schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
            responses:
                "200":
                    description: Paginated notification records for the authenticated user
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    items:
                                        type: array
                                        items:
                                            type: object
                                            properties:
                                                id: { type: string }
                                                type: { type: string, example: welcome }
                                                channel: { type: string, example: email }
                                                status: { type: string, enum: [queued, sent, failed, skipped] }
                                                createdAt: { type: string, format: date-time }
                                                updatedAt: { type: string, format: date-time }
                                                errorSummary: { type: string }
                                    total: { type: integer }
                                    page: { type: integer }
                                    size: { type: integer }
                "401":
                    description: Authentication required

    /health:
        get:
            tags:
                - Health
            summary: Health check for API Gateway
            description: Returns the health status of the API Gateway itself.
            operationId: ApiGateway_Health
            responses:
                "200":
                    description: API Gateway is healthy
                    content:
                        text/plain:
                            schema:
                                type: string
                                example: "ok"

    /api/auth/login:
        post:
            tags:
                - Auth
            summary: User login
            description: Authenticate user with email and password
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LoginRequest'
            responses:
                "200":
                    description: Login successful
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/LoginResponse'
                "400":
                    description: Invalid request format
                "401":
                    description: Invalid credentials
                "502":
                    description: Auth service unavailable

    /api/auth/register:
        post:
            tags:
                - Auth
            summary: User registration
            description: Register a new user account
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RegisterRequest'
            responses:
                "201":
                    description: Registration successful
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RegisterResponse'
                "400":
                    description: Invalid input or registration failed
                "502":
                    description: Auth service unavailable

    /api/auth/validate:
        post:
            tags:
                - Auth
            summary: Validate JWT token
            description: Validate the provided JWT token and return user information
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TokenValidationRequest'
            responses:
                "200":
                    description: Token validation result
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TokenValidationResponse'
                "400":
                    description: Invalid request format
                "500":
                    description: Token validation error
                "502":
                    description: Auth service unavailable

    /api/auth/refresh:
        post:
            tags:
                - Auth
            summary: Refresh JWT token
            description: Refresh an existing JWT token to extend session
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RefreshTokenRequest'
            responses:
                "200":
                    description: Token refreshed successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RefreshTokenResponse'
                "401":
                    description: Invalid or expired token
                "502":
                    description: Auth service unavailable

    /api/auth/account:
        delete:
            tags:
                - Auth
            summary: Delete the current user account
            description: Delete the authenticated account and publish a user.deleted.v1 event to remove its profile.
            operationId: AuthService_DeleteAccount
            security:
                - cookieAuth: []
                - bearerAuth: []
            responses:
                "200":
                    description: Account deleted and session cleared
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    status:
                                        type: string
                                        example: success
                                    message:
                                        type: string
                                        example: account deleted
                "401":
                    description: Missing, invalid, or expired session token
                "500":
                    description: Account deletion or deletion event publication failed
                "502":
                    description: Auth service unavailable

    /api/users/profile/me:
        get:
            tags:
                - User
            summary: Get current user profile
            description: Retrieve the authenticated user's profile using JWT token
            security:
                - bearerAuth: []
            responses:
                "200":
                    description: User profile retrieved successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/User'
                "401":
                    description: Unauthorized - Invalid or missing token
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                "404":
                    description: User not found
                "500":
                    description: Internal server error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'


    /api/users/list:
        get:
            tags:
                - User
            summary: List users with pagination
            description: Get a paginated list of all users
            parameters:
                - name: page
                  in: query
                  required: false
                  schema:
                    type: integer
                    default: 1
                    minimum: 1
                  description: Page number for pagination
                - name: size
                  in: query
                  required: false
                  schema:
                    type: integer
                    default: 10
                    minimum: 1
                    maximum: 100
                  description: Number of users per page
            responses:
                "200":
                    description: List of users retrieved successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UserListResponse'
                "500":
                    description: Internal server error
                "502":
                    description: User service unavailable
components:
    securitySchemes:
        cookieAuth:
            type: apiKey
            in: cookie
            name: access_token
            description: HttpOnly session cookie set by login and register
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
            description: Enter JWT token in the format 'Bearer <token>'
    schemas:
        HealthStatus:
            type: object
            properties:
                status:
                    type: string
                    example: "healthy"
                service:
                    type: string
                    example: "auth-service"
            description: Health status response from services
        # Auth Service Schemas
        LoginRequest:
            type: object
            properties:
                email:
                    type: string
                    format: email
                    example: "user@example.com"
                    description: User's email address
                password:
                    type: string
                    minLength: 6
                    example: "password123"
                    description: User's password
            required:
                - email
                - password
        LoginResponse:
            type: object
            properties:
                status:
                    type: string
                    example: "success"
                    description: Login status
                token:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                    description: JWT authentication token
        RegisterRequest:
            type: object
            properties:
                name:
                    type: string
                    example: "John Doe"
                    description: User's full name
                email:
                    type: string
                    format: email
                    example: "john.doe@example.com"
                    description: User's email address
                password:
                    type: string
                    minLength: 6
                    example: "password123"
                    description: User's password
                confirmPassword:
                    type: string
                    minLength: 6
                    example: "password123"
                    description: Password confirmation (must match password)
            required:
                - name
                - email
                - password
                - confirmPassword
        RegisterResponse:
            type: object
            properties:
                status:
                    type: string
                    example: "success"
                    description: Registration status
                message:
                    type: string
                    example: "User registered successfully"
                    description: Registration result message
                token:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                    description: JWT issued for the new session
            required:
                - status
                - message
                - token
        TokenValidationRequest:
            type: object
            properties:
                token:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                    description: JWT token to validate
            required:
                - token
        TokenValidationResponse:
            type: object
            properties:
                valid:
                    type: boolean
                    example: true
                    description: Whether the token is valid
                user_id:
                    type: string
                    example: "507f1f77bcf86cd799439011"
                    description: User ID if token is valid
                message:
                    type: string
                    example: "Token is valid"
                    description: Validation result message
        RefreshTokenRequest:
            type: object
            properties:
                token:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                    description: Current JWT token to refresh
            required:
                - token
        RefreshTokenResponse:
            type: object
            properties:
                status:
                    type: string
                    example: "success"
                    description: Refresh operation status
                token:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                    description: New JWT token

        # User Service Schemas
        User:
            type: object
            properties:
                id:
                    type: string
                    example: "507f1f77bcf86cd799439011"
                    description: Unique user identifier
                name:
                    type: string
                    example: "John Doe"
                    description: User's full name
                email:
                    type: string
                    format: email
                    example: "john.doe@example.com"
                    description: User's email address
                password:
                    type: string
                    description: User's hashed password (not returned in responses for security)
                status:
                    type: string
                    example: "active"
                    description: User account status
                role:
                    type: string
                    example: "user"
                    description: User role in the system
                createdAt:
                    type: string
                    format: date-time
                    example: "2024-01-15T10:30:00Z"
                    description: Account creation timestamp
                updatedAt:
                    type: string
                    format: date-time
                    example: "2024-01-20T14:45:00Z"
                    description: Last update timestamp
        UserListResponse:
            type: object
            properties:
                users:
                    type: array
                    items:
                        $ref: '#/components/schemas/User'
                    description: Array of user objects
                total:
                    type: integer
                    example: 150
                    description: Total number of users
                page:
                    type: integer
                    example: 1
                    description: Current page number
                size:
                    type: integer
                    example: 10
                    description: Number of users per page
        UpdateUserRequest:
            type: object
            properties:
                name:
                    type: string
                    example: "Jane Smith"
                    description: Updated user name
                email:
                    type: string
                    format: email
                    example: "jane.smith@example.com"
                    description: Updated email address
                role:
                    type: string
                    example: "admin"
                    description: Updated user role
