<main class="mx-auto mt-12 max-w-lg rounded-lg bg-white p-8 shadow">
  <h1 class="text-2xl font-semibold text-gray-900">Reset your password</h1>
  <p *ngIf="success" class="mt-4 text-emerald-800" role="status">
    Password reset successfully. All existing sessions have been signed out.
    <a routerLink="/login" class="font-medium underline">Sign in</a>
  </p>
  <form
    *ngIf="!success"
    [formGroup]="passwordForm"
    (ngSubmit)="resetPassword()"
    class="mt-6 space-y-4"
  >
    <label class="block text-sm font-medium text-gray-700">
      New password
      <input
        type="password"
        formControlName="newPassword"
        autocomplete="new-password"
        class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2"
      />
      <span
        *ngIf="passwordForm.controls['newPassword'].invalid && passwordForm.controls['newPassword'].touched"
        class="mt-1 block text-sm text-red-700"
      >
        Use 6 to 72 characters.
      </span>
    </label>
    <label class="block text-sm font-medium text-gray-700">
      Confirm new password
      <input
        type="password"
        formControlName="confirmPassword"
        autocomplete="new-password"
        class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2"
      />
      <span
        *ngIf="passwordForm.hasError('passwordMismatch') && passwordForm.controls['confirmPassword'].touched"
        class="mt-1 block text-sm text-red-700"
      >
        Passwords do not match.
      </span>
    </label>
    <p *ngIf="errorMessage" class="text-sm text-red-700" role="alert">
      {{ errorMessage }}
    </p>
    <button
      type="submit"
      [disabled]="saving"
      class="rounded-md bg-emerald-700 px-4 py-2 font-medium text-white disabled:opacity-50"
    >
      {{ saving ? "Saving..." : "Reset password" }}
    </button>
  </form>
</main>
