# Production stack. Run from repo root:
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d --build
# Or via: ./deploy.sh

services:
  mongodb:
    image: mongo:8.0
    container_name: mongodb
    restart: unless-stopped
    # Not published to the host — only reachable on the Docker network.
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE:-auth_db}
      - GLIBC_TUNABLES=glibc.pthread.rseq=1
    volumes:
      - mongodb_data_v8:/data/db
    networks:
      - microservices-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  kafka:
    image: apache/kafka:4.1.2
    container_name: kafka
    restart: unless-stopped
    # Not published to the host — only reachable on the Docker network.
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CLUSTER_ID=q1Sh-9_ISia_zwGINzRvyQ
    networks:
      - microservices-network

  auth-service:
    build:
      context: ../backend/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    restart: unless-stopped
    expose:
      - "8081"
    environment:
      - PORT=8081
      - MONGO_URI=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017
      - MONGO_DB=auth_db
      - JWT_SECRET=${JWT_SECRET}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - COOKIE_SAME_SITE=${COOKIE_SAME_SITE:-None}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_CLIENT_ID=auth-service
      - KAFKA_TOPIC_USER_CREATED=user.created.v1
      - KAFKA_TOPIC_USER_UPDATED=user.updated.v1
      - KAFKA_TOPIC_USER_DELETED=user.deleted.v1
      - GIN_MODE=release
      - LOG_LEVEL=${LOG_LEVEL:-0}
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 3

  user-service:
    build:
      context: ../backend/user-service
      dockerfile: Dockerfile
    container_name: user-service
    restart: unless-stopped
    expose:
      - "8082"
    environment:
      - PORT=8082
      - MONGO_URI=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017
      - MONGO_DB=user_db
      - JWT_SECRET=${JWT_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_CLIENT_ID=user-service
      - KAFKA_GROUP_ID=user-service-group
      - KAFKA_TOPIC_USER_CREATED=user.created.v1
      - KAFKA_TOPIC_USER_UPDATED=user.updated.v1
      - KAFKA_TOPIC_USER_DELETED=user.deleted.v1
      - GIN_MODE=release
      - LOG_LEVEL=${LOG_LEVEL:-0}
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 3

  notification-service:
    build:
      context: ../backend/notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    restart: unless-stopped
    expose:
      - "8083"
    environment:
      - PORT=8083
      - MONGO_URI=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017
      - MONGO_DB=notification_db
      - JWT_SECRET=${JWT_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_GROUP_ID=notification-service-group
      - KAFKA_CLIENT_ID=notification-service
      - KAFKA_TOPIC_USER_CREATED=user.created.v1
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - GIN_MODE=release
      - LOG_LEVEL=${LOG_LEVEL:-0}
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 3

  api-gateway:
    build:
      context: ../backend/api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    environment:
      - PORT=8080
      - LOG_LEVEL=${LOG_LEVEL:-0}
    command: ["./api-gateway", "-conf", "/data/conf/config.yaml"]
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ../backend/api-gateway/configs/config.yaml:/data/conf/config.yaml:ro

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8085}:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - microservices-network

volumes:
  mongodb_data_v8:

networks:
  microservices-network:
    driver: bridge
